version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: school-admission-postgres
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: schooladmission
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schooladmission"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school-admission-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=schooladmission;Username=postgres;Password=postgres;MaxPoolSize=200;
      HOLD_DURATION_SECONDS: 600
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school-admission-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    name: school-admission-postgres-data
